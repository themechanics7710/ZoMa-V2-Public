; ZoMa RX firmware (esp32_rx) — PlatformIO build environments.
; Property of TheMechanics. Contact: mamau.mechanics@gmail.com
;
; Two environments, same firmware logic:
;   - debug_bench: plain Serial.println() output, no micro-ROS compiled in. Bench
;     testing over a normal/data USB cable with the PlatformIO Serial Monitor.
;   - deploy_ros:  micro-ROS active on Serial/UART0, all DBG_* output compiles to
;     nothing. Used with a data-only (red wire cut) USB cable to the Raspberry Pi
;     for real robot operation.
;
; Prove any firmware change on debug_bench before switching to deploy_ros.
;
; upload_port is intentionally left unset — PlatformIO auto-detects it. Set a
; per-machine override locally (not committed) if auto-detection picks the wrong
; port on your setup.

[env:debug_bench]
platform = espressif32
board = esp32dev
framework = arduino
; CORE_DEBUG_LEVEL=4 surfaces ESP-IDF's own internal log lines (WiFi events,
; driver warnings, etc.) alongside the firmware's own DBG_* prints. Bench-only.
build_flags = -D DEBUG_BENCH -D CORE_DEBUG_LEVEL=4
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; cal_test_1..cal_test_5 inherit debug_bench (including lib_deps) and add
; CAL_TEST=n on top, so each calibration test is reachable by name without
; touching the default (no-flag) build, which is drive mode. See src/main.cpp's
; CALIBRATION MODE SELECT block for what each number runs.
[env:cal_test_1]
extends = env:debug_bench
build_flags = ${env:debug_bench.build_flags} -D CAL_TEST=1

[env:cal_test_2]
extends = env:debug_bench
build_flags = ${env:debug_bench.build_flags} -D CAL_TEST=2

[env:cal_test_3]
extends = env:debug_bench
build_flags = ${env:debug_bench.build_flags} -D CAL_TEST=3

[env:cal_test_4]
extends = env:debug_bench
build_flags = ${env:debug_bench.build_flags} -D CAL_TEST=4

; CAL TEST 5: BNO055 bring-up -- isolated yaw/pitch/roll serial log, no motor code
; involved. See src/main.cpp's CALIBRATION MODE SELECT block.
[env:cal_test_5]
extends = env:debug_bench
build_flags = ${env:debug_bench.build_flags} -D CAL_TEST=5

[env:deploy_ros]
; Hard-pinned — do not bump. Newer espressif32 platform releases moved to Arduino
; core 3.x, which micro_ros_platformio's build system doesn't support.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
build_flags = -D DEPLOY_ROS
monitor_speed = 921600
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
board_microros_transport = serial
