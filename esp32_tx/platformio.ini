; ZoMa TX firmware — PlatformIO project configuration.
; Property of TheMechanics. Contact: mamau.mechanics@gmail.com

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; upload_port / monitor_port intentionally left unset — PlatformIO
; auto-detects the serial port. Set per-machine overrides locally if needed.

monitor_speed = 115200

; Avoids a USB serial hang on some boards.
build_flags =
    -D CORE_DEBUG_LEVEL=0

board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    hamzayslmn/esp-ps5 @ ^1.3.3
